[package]
name = "miden-air"
version.workspace = true
description = "Algebraic intermediate representation of Miden VM processor"
documentation = "https://docs.rs/miden-air"
readme = "README.md"
categories = ["cryptography", "no-std"]
keywords = ["air", "arithmetization", "crypto", "miden"]
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[lib]
bench = false
doctest = false

[[bench]]
name = "compute_op_flags"
harness = false

[[bench]]
name = "enforce_stack_constraint"
harness = false

[features]
default = ["std"]
std = ["miden-core/std", "winter-air/std", "thiserror/std"]
testing = []

[dependencies]
thiserror = { workspace = true }
# vm-core = { package = "miden-core", path = "../core", version = "0.14", default-features = false }
# winter-air= { workspace = true }
# p3-air = { version = "0.3.0" }
# p3-matrix = { version = "0.3.0" }
# p3-field = { version = "0.3.0" }
# p3-uni-stark = { version = "0.3.0" }
# p3-commit = { version = "0.3.0" }

p3-air        = { branch = "zz/migrate-plonky3", default-features = false, git = "https://github.com/0xMiden/Plonky3/" }
p3-matrix = { branch = "zz/migrate-plonky3", default-features = false, git = "https://github.com/0xMiden/Plonky3/" }
p3-field      = { branch = "zz/migrate-plonky3", default-features = false, git = "https://github.com/0xMiden/Plonky3/" }
p3-uni-stark  = { branch = "zz/migrate-plonky3", default-features = false, git = "https://github.com/0xMiden/Plonky3/" }
p3-commit  = { branch = "zz/migrate-plonky3", default-features = false, git = "https://github.com/0xMiden/Plonky3/" }

serde = { version = "1.0", features = ["derive"]}
bincode = "1.3"
miden-core.workspace = true
winter-air.workspace = true
winter-prover.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
winter-rand-utils.workspace = true
